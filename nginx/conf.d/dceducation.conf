upstream backend_upstream {
    server backend:8080;
}

# Production main site: HTTP -> HTTPS (and ACME challenge for Let's Encrypt)
server {
    listen 80;
    server_name dceducation.com.cn www.dceducation.com.cn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name dceducation.com.cn www.dceducation.com.cn;

    ssl_certificate /etc/letsencrypt/live/dceducation.com.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dceducation.com.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    root /var/www/frontend;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Production backend site: HTTP -> HTTPS (and ACME challenge for Let's Encrypt)
server {
    listen 80;
    server_name backend.dceducation.com.cn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name backend.dceducation.com.cn;

    ssl_certificate /etc/letsencrypt/live/dceducation.com.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dceducation.com.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    root /var/www/backend-frontend;
    index login.html;

    # Redirect .html URLs to clean paths
    location ~* \.html$ {
        rewrite ^/(.+)\.html$ /$1 permanent;
    }

    location / {
        try_files $uri $uri/ $uri.html /coming_soon.html;
    }

    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

